<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Stanford Solar Car Project</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=SF+Pro+Text:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation Container -->
    <div id="navigation-container"></div>

    <!-- Contact Hero Section -->
    <section class="contact-hero">
        <div class="contact-hero-background">
            <img src="../assets/images/race-photos/1.jpg" alt="Contact Us" class="contact-hero-bg-image">
            <div class="contact-hero-overlay"></div>
        </div>
        <div class="contact-hero-content">
            <h1 class="contact-hero-title">Contact Us</h1>
            <p class="contact-hero-subtitle">Have a question or want to get involved? We'd love to hear from you.</p>
        </div>
    </section>


    <!-- Contact Form Section -->
    <section class="contact-form-section section-fade">
        <div class="container">
            <div class="form-container">
                <form class="contact-form" id="contactForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" name="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" name="lastName" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Subject *</label>
                        <select id="subject" name="subject" required>
                            <option value="">Select a subject</option>
                            <option value="general">General Inquiry</option>
                            <option value="join">Joining the Team</option>
                            <option value="sponsorship">Sponsorship Opportunity</option>
                            <option value="media">Media Inquiry</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea id="message" name="message" rows="6" required placeholder="Tell us more about your inquiry..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn-primary large">Send Message</button>
                </form>
            </div>
        </div>
    </section>


    <!-- Footer Container -->
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="../assets/js/component-loader.js"></script>
    <script src="../assets/js/script.js"></script>
</body>
</html>
